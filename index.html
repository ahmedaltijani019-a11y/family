<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عائلتنا | المنصة الذكية السحابية</title>
    <link rel="stylesheet" href="style.css">
    <!-- مكتبة التأثيرات المرئية -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>

    <!-- نافذة تسجيل الدخول -->
    <div id="authModal" class="auth-modal" style="display: none;">
        <div class="auth-card">
            <div class="auth-icon">🏠</div>
            <h2>تسجيل دخول عائلة التجاني</h2>
            <p>اختر اسمك وأدخل رمز الـ PIN الخاص بالمتابعة:</p>
            
            <div class="auth-form-group">
                <label for="loginUserSelect">اسم فرد العائلة</label>
                <select id="loginUserSelect">
                    <option value="الوالد التجاني">الوالد التجاني</option>
                    <option value="الوالدة تهاني">الوالدة تهاني</option>
                    <option value="أحمد">أحمد</option>
                    <option value="السر">السر</option>
                    <option value="أسامة">أسامة</option>
                    <option value="محمد">محمد</option>
                </select>
            </div>

            <div class="auth-form-group">
                <label for="loginPinInput">رمز المرور (PIN)</label>
                <input type="password" id="loginPinInput" placeholder="******" maxlength="6">
            </div>

            <button type="button" id="loginBtn" onclick="handleLogin()">دخول المنصة 🚀</button>
            <p id="authErrorMsg" class="error-msg"></p>
        </div>
    </div>

    <!-- الواجهة الرئيسية -->
    <div class="app-container">
        <!-- شريط التنقل العلوي -->
        <header class="app-header">
            <div class="user-welcome" id="currentLoggedUserDisplay">مرحباً</div>
            <div class="header-controls">
                <button id="themeToggle" class="theme-btn"><span id="themeIcon">🌙</span> <span id="themeLabel">الوضع الليلي</span></button>
                <button onclick="handleLogout()" class="logout-btn">تسجيل الخروج</button>
            </div>
        </header>

        <main class="main-content">
            <!-- لوحة المتصدرين -->
            <section class="sidebar-section">
                <h3>🏆 لوحة المتصدرين</h3>
                <div id="leaderboard"></div>
                <div class="info-card">
                    <p>⭐ يتم مزامنة النقاط لحظياً عبر السحابة.</p>
                </div>
            </section>

            <!-- إدارة المهام -->
            <section class="tasks-section">
                <div class="card">
                    <h2>إضافة طلب أو تذكير</h2>
                    <form id="taskForm">
                        <div class="form-group">
                            <label for="taskInput">اسم المهمة</label>
                            <input type="text" id="taskInput" placeholder="اكتب المهمة هنا..." required>
                        </div>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="userSelect">المسؤول عن المهمة</label>
                                <select id="userSelect">
                                    <option value="الوالد التجاني">الوالد التجاني</option>
                                    <option value="الوالدة تهاني">الوالدة تهاني</option>
                                    <option value="أحمد">أحمد</option>
                                    <option value="السر">السر</option>
                                    <option value="أسامة">أسامة</option>
                                    <option value="محمد">محمد</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="categorySelect">التصنيف</label>
                                <select id="categorySelect">
                                    <option value="📌 أخرى">📌 أخرى</option>
                                    <option value="🛒 طلبات منزلية">🛒 طلبات منزلية</option>
                                    <option value="💻 مهام برمجية">💻 مهام برمجية</option>
                                    <option value="🧹 ترتيب وتنظيف">🧹 ترتيب وتنظيف</option>
                                    <option value="🍳 وجبات الطعام">🍳 وجبات الطعام</option>
                                </select>
                            </div>
                        </div>
                        <button type="submit" class="submit-btn">+ إضافة المهمة للسحابة</button>
                    </form>
                </div>

                <!-- قائمة المهام -->
                <div class="card">
                    <div class="tasks-header">
                        <h2>قائمة المهام السحابية</h2>
                        <span id="taskCount" class="badge-count">0 مهمة</span>
                    </div>
                    <div class="filters">
                        <button class="filter-btn active" data-filter="all">الكل</button>
                        <button class="filter-btn" data-filter="pending">قيد الانتظار</button>
                        <button class="filter-btn" data-filter="completed">مكتملة</button>
                    </div>
                    <ul id="taskList"></ul>
                    <div id="emptyState" class="empty-state">لا توجد مهام حالياً</div>
                </div>
            </section>
        </main>
    </div>

    <!-- ملف الجافاسكريبت الرئيسي -->
    <script type="module" src="script.js"></script>
</body>
</html>
